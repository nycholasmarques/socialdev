services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: socialdev
      POSTGRES_PASSWORD: root
      POSTGRES_DB: socialdev
    ports:
      - "5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  app:
    build: 
      context: .
      target: builder
    command: 
      - go
      - run
      - ./cmd/server/
    depends_on:
      - db
    environment:
      DATABASE_URL: "postgresql://socialdev:root@db:5432/socialdev?sslmode=disable"
    ports:
      - "8080:8080"

volumes:
  db-data:
name: socialdev
services:
  db:
    container_name: socialdev-db
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: socialdev
      POSTGRES_PASSWORD: root
      POSTGRES_DB: socialdev
    ports:
      - "5432:5432"
    volumes:
      - db-socialdev:/var/lib/postgresql/data

  app:
    container_name: socialdev
    build: 
      context: .
      target: builder 
      command: air -c .air.toml
    depends_on:
      - db
    environment:
      DATABASE_URL: "postgresql://socialdev:root@db:5432/socialdev?sslmode=disable"
    ports:
      - "8080:8080"
    volumes:
      - .:/app

volumes:
  db-socialdev:
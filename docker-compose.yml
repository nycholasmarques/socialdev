name: socialdev
services:
  db:
    container_name: socialdev-db
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: socialdev
      POSTGRES_PASSWORD: root
      POSTGRES_DB: socialdev
    ports:
      - "5432:5432"
    volumes:
      - db-socialdev:/var/lib/postgresql/data

  app:
    container_name: socialdev
    build: 
      context: .
      target: builder 
    command: air -c .air.toml
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USER: socialdev
      DB_PASSWORD: root
      DB_NAME: socialdev
      DB_PORT: 5432
    ports:
      - "8080:8080"
    volumes:
      - .:/app

volumes:
  db-socialdev: